name: iOS port

# A pipeline, not four independent builds.  Each stage consumes the previous
# stage's output, because the expensive things are shared:
#
#   checks       ~10 s, ubuntu.  Structural checks -- chiefly that every
#                fork-local patch still applies to the revision it is pinned
#                to.  Gates everything else, so a stale patch costs seconds
#                rather than an hour of build.
#   host-build   ~40-70 min, macOS.  Builds the host julia, runs the tests
#                that need a runnable REPL, and *publishes usr/ as an
#                artifact*.  Both iOS jobs need a host julia for the sysimage
#                bake, so this is the producer, not a parallel tier.
#   ios-sim      macOS, opt-in.  Restores the host julia, builds the
#                simulator slice, and RUNS it under `simctl spawn`.  The only
#                stage that executes iOS-targeted code.
#   ios-build    macOS, opt-in.  Same, for the device slice, which cannot be
#                run here but is the artifact an app ships.
#
# The two iOS stages cost hours, so they never run by default.  Opt in either
# from the Actions tab (Run workflow), or by putting `[run-ios]` in a commit
# message -- the latter so an automation that can push but has no
# `actions: write` token can still drive a build.
#
# Caching, and what is deliberately not cached:
#
#   deps/srccache        Upstream tarballs.  The same key in every job -- they
#                        fetch the same files, and an iOS build downloads a
#                        superset of what a host build does.  A truncated
#                        tarball here is sticky, since the download rule only
#                        fires when the file is absent; jldownload deletes a
#                        partial transfer to prevent that, and the `v2` salt
#                        drops caches predating it.  The key is spelled out at
#                        each use rather than hoisted into a workflow-level
#                        `env`, where hashFiles() is not an allowed context
#                        and silently yields a run with no jobs at all.
#   host-usr artifact    The host julia, passed from host-build to both iOS
#                        jobs.  Tarred rather than uploaded as a directory
#                        because upload-artifact drops executable bits and
#                        dereferences symlinks, both of which usr/ needs.
#                        build-xcframework.sh's ensure_host_julia finds the
#                        restored tree and skips building its own.
#   build-ios-*/usr      The installed iOS dependency prefix, LLVM included.
#                        Keyed only on what feeds the dependency build, so
#                        ordinary src/ iteration keeps hitting it; any change
#                        under deps/ or Make.inc invalidates it and pays for
#                        a full rebuild.  The dependency *build* trees are
#                        tens of GB and are not cached, so a miss is a real
#                        multi-hour rebuild.
#
# Coverage, since the stages are not interchangeable.  The simulator defines
# TARGET_OS_IPHONE, so `_OS_IOS_` is on and the code with no upstream
# equivalent runs there: the libffi ccall interpreter, the sysctl CPU
# detection that feeds sysimage target matching, the framework dlopen
# fallback, Accelerate forwarding.  Only the device build compiles
# jitlayers.cpp's JL_IOS_NO_CODEGEN block, gated `!TARGET_OS_SIMULATOR`.
# Neither can show anything caused by a device *restriction* rather than by
# iOS code: the simulator runs under macOS rules, so the JIT works, fork/exec
# succeed, and the bundle is writable.

on:
  push:
    branches: [claude/ios-runtime-1.12]
    paths-ignore: ['doc/**', '**/*.md']
  pull_request:
    branches: [claude/ios-runtime-1.12]
  workflow_dispatch:
    inputs:
      run_ios_sim:
        description: 'Build and RUN the simulator slice'
        type: boolean
        default: false
      run_ios_build:
        description: 'Build the device slice (cannot be run here)'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: structural checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Lets ci-checks.sh compile the iOS-only regions of src/ here rather than
      # leaving them to the cross-build; it skips that check without these.
      - name: Install the headers the iOS-only compile check needs
        # The full set the iOS-only translation units reach, taken from `cc -M`
        # over them: llvm-c, then ffi.h, libunwind.h and uv.h via julia_internal.h.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm-dev libffi-dev libunwind-dev libuv1-dev
      - run: contrib/ios/ci-checks.sh
        env:
          # These runners have the headers, so a file that cannot be compiled
          # here is a regression in the check rather than a thin environment.
          IOS_CHECKS_REQUIRE_COMPILE: 1

  # Everything in ci-checks.sh that needs macOS and the iOS SDK -- chiefly
  # expanding sysimage-ios.mk, which cannot parse elsewhere.  Kept a separate
  # job because it needs no build, and so answers in seconds alongside
  # host-build rather than after it.
  macos-checks:
    name: macOS-only checks
    needs: checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages pyyaml || true
      - run: xcrun --sdk iphoneos --show-sdk-path
      - run: contrib/ios/ci-checks.sh --offline

  host-build:
    name: macOS host build
    needs: checks
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: deps/srccache
          key: srccache-v2-${{ hashFiles('deps/*.version', 'deps/checksums/**') }}
          restore-keys: srccache-v2-

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "MAKEFLAGS=-j$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      # JULIA_PRECOMPILE=0 skips generate_precompile.jl for the host julia,
      # a large fraction of the wall time that exercises nothing this fork
      # changes.  It applies to this job only; the iOS bake runs its own
      # precompile pass against the cross target (see sysimage-ios.mk).
      #
      # It does NOT skip `stdlibs-cache-release`, deliberately: precompiling
      # every stdlib is what catches a JLL this fork has broken.
      #
      # The cost of keeping that phase is REPL's precompile workload, which is
      # flaky here for reasons unrelated to iOS.  It drives a fake PTY, types
      # expressions that raise on purpose, and greps the transcript for
      # "ERROR:" against a substring allow-list
      # (stdlib/REPL/src/precompile.jl).  A short read can truncate one of
      # those deliberate errors past the point where the allow-list matches,
      # and the workload then calls exit(1).
      #
      # So: retry, but only on that signature, and only a bounded number of
      # times.  `make` is incremental and the other 107 configurations stay
      # cached, so a retry re-runs the precompile phase in minutes rather than
      # rebuilding.  Any other failure fails the job on the first attempt.
      - name: Build
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/build.log"

          # The same flake does not always FAIL the precompile phase -- it can
          # HANG it.  `precompilepkgs` stops emitting after the failed
          # configuration and never returns, leaving orphan julia processes
          # behind, so `make` never exits, the retry below never runs, and one
          # hang consumes the job's entire timeout-minutes budget.  Bound each
          # attempt: a cached build finishes in about 20 minutes, so 50 leaves
          # ample headroom and still fits three attempts.
          attempt_timeout=$((50 * 60))

          for attempt in 1 2 3; do
              ( set -o pipefail; make JULIA_PRECOMPILE=0 VERBOSE=1 2>&1 | tee "$log" ) &
              build_pid=$!

              # Watch it from the foreground rather than backgrounding a
              # watchdog: a backgrounded `sleep` outlives the step whichever way
              # the attempt ends, and the runner reports it under "Terminate
              # orphan process" -- noise that would hide a real stray.  This
              # also makes the timeout an explicit flag instead of something
              # inferred from an exit status that SIGTERM shares.
              deadline=$(( $(date +%s) + attempt_timeout ))
              timed_out=0
              while kill -0 "$build_pid" 2>/dev/null; do
                  if [[ "$(date +%s)" -ge "$deadline" ]]; then
                      kill -TERM "$build_pid" 2>/dev/null || true
                      timed_out=1
                      break
                  fi
                  sleep 5
              done
              # `if wait`, not a bare `wait`: under `set -e` a bare wait on a
              # child that exits nonzero aborts the script, and every retry
              # path below depends on seeing that status.
              if wait "$build_pid"; then rc=0; else rc=$?; fi

              if [[ "$rc" -eq 0 ]]; then
                  [[ "$attempt" -gt 1 ]] && echo "::notice::build succeeded on attempt $attempt"
                  exit 0
              fi

              if [[ "$timed_out" -eq 1 ]]; then
                  # Killing the subshell orphans make and its julia children
                  # rather than reaping them, and those hold the depot locks a
                  # retry would wait on forever.
                  echo "::warning::attempt $attempt exceeded ${attempt_timeout}s (precompile hang); killing strays and retrying"
                  pkill -f "$PWD/usr/bin/julia" 2>/dev/null || true
                  pkill -x make 2>/dev/null || true
                  sleep 5
                  continue
              fi

              if ! grep -q 'Failed to precompile REPL' "$log" \
                 || ! grep -q 'Review REPL precompilation with debug_output on' "$log"; then
                  echo "::error::build failed for a reason other than the known REPL PTY flake"
                  exit 1
              fi
              echo "::warning::attempt $attempt hit the REPL fake-PTY transcript flake; retrying"
          done
          echo "::error::the build failed 3 times (REPL flake and/or precompile hang) -- no longer plausibly a flake"
          exit 1

      - name: Version
        run: ./usr/bin/julia -e 'using InteractiveUtils; versioninfo()'

      # Roughly 25 files this fork touches are not iOS-gated -- every stdlib
      # JLL's empty!(PATH_list), base/options.jl, and both stdlib patches,
      # which the external-stdlib patch step applies on any platform.  Check
      # they took, rather than trusting that `make` would have failed.
      - name: Patched stdlibs took effect
        run: |
          ./usr/bin/julia --startup-file=no -e '
            using Pkg
            for f in (:can_spawn_7z, :open_gzip_tarball)
                isdefined(Pkg.PlatformEngines, f) || error("Pkg.PlatformEngines.$f missing")
            end
            using LinearAlgebra
            for f in (:forward_accelerate!, :report)
                isdefined(LinearAlgebra.BLAS, f) || error("BLAS.$f missing")
            end
            println("stdlib patches applied")'

      # These need a runnable REPL, and the iOS build produces no executable
      # (EXE := in Make.inc), so this is the only stage that can run them.
      - name: Spawn-free gzip
        run: ./usr/bin/julia --startup-file=no contrib/ios/test-gzip-inflate.jl

      - name: Accelerate forwarding
        run: ./usr/bin/julia --startup-file=no contrib/ios/test-accelerate.jl

      # Smoke-test the single-process test driver on the host, where a bug in
      # it is a two-minute failure rather than one that surfaces after a
      # dependency build, a sysimage bake and a simulator boot.  It is copied
      # into test/ because that is where build-xcframework.sh stages it and
      # where its relative `include("choosetests.jl")` resolves.
      #
      # This checks the driver, not the port: the host julia has a JIT and a
      # julia executable.  contrib/ios/simulator-runtests.c is what runs it
      # under the constraints that matter.
      - name: iOS test driver runs
        run: |
          cp contrib/ios/ios_runtests.jl test/ios_runtests.jl
          ./usr/bin/julia --startup-file=no --check-bounds=yes --depwarn=error \
              -e 'include("test/ios_runtests.jl"); exit(Main.IOS_TEST_FAILURES)' \
              goto some ordering osutils version meta
          rm -f test/ios_runtests.jl

      # The same driver in tier 2's execution mode, which the step above does
      # not cover: it runs under the host's JIT, so it says nothing about
      # whether the suite survives interpretation.
      #
      #   --compile=min          everything outside the sysimage interprets,
      #                          as on a device.
      #   --compiled-modules=no  forces every `using` to load from SOURCE.
      #
      # That second flag has to be `no`, not the `existing` that
      # julia_ios_init_with_paths sets.  They mean the same thing on iOS, where
      # the bundle ships no cache files and `existing` therefore always falls
      # through to source -- but not here, where the host depot is fully
      # populated and `existing` loads Test from a cache, exercising nothing.
      #
      # Loading from source is where tier 2 actually broke (`using Test` pulls
      # in InteractiveUtils, Markdown and JuliaSyntaxHighlighting), so it is
      # the part that has to be reproduced.  Still not iOS -- this has a julia
      # executable and a writable tree -- but it finishes in minutes rather
      # than after a bake and a simulator boot.
      - name: iOS test driver runs under the interpreter
        run: |
          cp contrib/ios/ios_runtests.jl test/ios_runtests.jl
          ./usr/bin/julia --startup-file=no --compile=min \
              --compiled-modules=no --check-bounds=yes --depwarn=error \
              -e 'include("test/ios_runtests.jl"); exit(Main.IOS_TEST_FAILURES)' \
              goto ordering
          rm -f test/ios_runtests.jl

      # usr/share/julia/stdlib/vX.Y is a directory of symlinks into
      # stdlib/<Name>-<sha>, so usr/ alone is not a working prefix anywhere
      # else: the iOS jobs build out of tree and extract their own copies
      # under build-ios-*/stdlib, leaving every one of those links dangling.
      # The bake reads them regardless of JULIA_LOAD_PATH -- base/sysimg.jl
      # forces @stdlib -- so the sources have to travel with the prefix.
      - name: Publish the host julia
        run: tar -czf "$RUNNER_TEMP/host-usr.tar.gz" usr stdlib/*-*/
      - uses: actions/upload-artifact@v4
        with:
          name: host-usr
          path: ${{ runner.temp }}/host-usr.tar.gz
          retention-days: 3

      # Step 1 of the --compile=all investigation (contrib/ios/CHANGES.md).
      #
      # The iOS bake used to pass --compile=all to its --output-o stage, which
      # bakes unspecialized entries that --compile=min then runs instead of
      # interpreting; removing it fixed `using Test` there.  Nothing in that
      # mechanism is iOS-specific, so the question is whether an ordinary host
      # sysimage built the same way breaks the same way.  If it does, this is a
      # general Julia bug with a small reproducer and no cross-compilation
      # involved; if it does not, the fault needs --target emission.
      #
      # Runs AFTER the artifact upload on purpose: it replaces usr/'s sysimage,
      # and the iOS jobs must consume the ordinary one.
      #
      # Reports either way and never fails the job -- reproducing is the
      # informative outcome, not a regression.
      - name: "Does --compile=all break --compile=min off-iOS?"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/compileall.log"
          # Both must go: the flag lives in the sys-o.a rule, so leaving the
          # archive in place would relink the old image and prove nothing.
          rm -f usr/lib/julia/sys-o.a usr/lib/julia/sys.dylib usr/lib/julia/sys.so
          # sysimage.mk is not included by the top-level Makefile, so its
          # targets are only reachable the way Makefile's julia-sysimg-% rule
          # reaches them.  Rebuilding just this target also avoids re-running
          # the stdlib precompile phase.
          make -C . -f sysimage.mk sysimg-release \
               JULIA_PRECOMPILE=0 HOST_SYSIMAGE_COMPILE_ALL=1 VERBOSE=1 2>&1 | tee "$log"
          # Guard against concluding anything from a build that never saw the
          # flag -- the whole experiment is worthless if this silently no-ops.
          grep -q -- '--compile=all' "$log" || {
            echo "::error::rebuild never passed --compile=all; result would be meaningless"
            exit 1
          }
          ./usr/bin/julia --version
          if ./usr/bin/julia --compile=min --startup-file=no \
               -e 'using Test; println("using Test: OK under --compile=min")'; then
            echo "::notice::--compile=all did NOT reproduce off-iOS -- the fault needs cross-target emission"
          else
            echo "::notice::--compile=all REPRODUCES off-iOS -- general Julia bug, no cross-compilation involved"
          fi

  ios-sim:
    name: iOS simulator build + run
    needs: host-build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_ios_sim) ||
      contains(github.event.head_commit.message, '[run-ios]')
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: deps/srccache
          key: srccache-v2-${{ hashFiles('deps/*.version', 'deps/checksums/**') }}
          restore-keys: srccache-v2-

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          echo "NPROC=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      # Before the dependency cache is restored, deliberately: `configure`
      # prompts on a non-empty BUILDROOT and there is no tty to answer it.
      # build-xcframework.sh skips its own configure once Make.inc exists.
      - name: Configure the out-of-tree build
        run: make O=build-ios-sim configure

      # Keyed on what feeds the dependency build and nothing else, so editing
      # src/ still hits it.  LLVM from source is the multi-hour step this
      # exists to skip.
      - name: Cache the iOS dependency prefix
        id: iosdeps
        uses: actions/cache@v4
        with:
          path: build-ios-sim/usr
          key: iosdeps-sim-${{ hashFiles('deps/*.version', 'deps/*.mk', 'deps/patches/**', 'deps/checksums/**', 'Make.inc') }}

      - uses: actions/download-artifact@v4
        with:
          name: host-usr
          path: ${{ runner.temp }}
      - name: Restore the host julia
        run: |
          tar -xzf "$RUNNER_TEMP/host-usr.tar.gz"
          ./usr/bin/julia -e 'println("host julia restored: ", VERSION)'

      # A restored prefix carries older mtimes than the fresh checkout, so
      # `make` would rebuild everything it just restored.  The cache key
      # already covers every input the dependency build reads, so marking the
      # prefix current is sound rather than a way to hide staleness.
      # `! -type l` is not a detail: touch follows a symlink, and a dangling
      # one gets its target created as an empty file.  usr/ is full of links
      # pointing outside itself.
      - name: Mark the restored dependency prefix current
        if: steps.iosdeps.outputs.cache-hit == 'true'
        run: find build-ios-sim/usr ! -type l -exec touch {} +

      # usr/ collects the stdlib install state as well as the dependency
      # prefix: a stamp per stdlib under usr/manifest/vX.Y and a link under
      # usr/share/julia/stdlib/vX.Y naming the extracted source in
      # build-ios-sim/stdlib, which is outside the cache.  Restored together
      # they tell make the stdlibs are installed while every link dangles, and
      # the bake stops at `Package SHA not found in current path`.  Dropping
      # the stamps re-extracts and re-links against this checkout, which is
      # untarring a few tens of MB, not rebuilding the dependencies.
      - name: Re-install the stdlibs over the restored prefix
        if: steps.iosdeps.outputs.cache-hit == 'true'
        run: |
          v="v$(cut -d. -f1-2 < VERSION)"
          rm -rf "build-ios-sim/usr/manifest/$v" \
                 "build-ios-sim/usr/share/julia/stdlib/$v"

      - name: Build the simulator slice
        env:
          SLICES: iphonesimulator
          # Stage test/ into the resources tree so the two test-suite steps
          # below have something to run.  Off by default: a shipping app has
          # no reason to carry the suite.
          IOS_STAGE_TESTS: 1
        run: contrib/ios/build-xcframework.sh "$PWD/ios-out"

      - name: Sysimage is an iOS-simulator arm64 Mach-O
        run: |
          sys=build-ios-sim/usr/lib/julia/sys.dylib
          file "$sys"
          lipo -archs "$sys" | grep -qx arm64 || { echo "not arm64"; exit 1; }
          vtool -show-build-version "$sys" | tee /tmp/vtool.txt
          grep -qi 'platform.*simulator' /tmp/vtool.txt \
            || { echo "sys.dylib is not built for the iOS simulator"; exit 1; }

      # No app bundle and no Xcode project: `simctl spawn` runs a plain Mach-O
      # built for the simulator platform.  julia_ios_init.c is compiled by the
      # embedding app rather than shipped inside the framework, so the harness
      # builds it here the way an app target would.
      - name: Build the self-test harness
        run: |
          fw="$PWD/build-ios-sim/install/Frameworks"
          xcrun --sdk iphonesimulator clang -arch arm64 -Wall \
                -mios-simulator-version-min=16.4 \
                -I contrib/ios -F "$fw" -framework Julia \
                -Wl,-rpath,"$fw" \
                contrib/ios/julia_ios_init.c \
                contrib/ios/simulator-selftest.c -o "$PWD/selftest"
          file "$PWD/selftest"

      # Same embedding API, but its job is to run Julia's own test suite
      # rather than a fixed set of assertions.  See contrib/ios/simulator-runtests.c.
      - name: Build the test-suite harness
        run: |
          fw="$PWD/build-ios-sim/install/Frameworks"
          xcrun --sdk iphonesimulator clang -arch arm64 -Wall \
                -mios-simulator-version-min=16.4 \
                -I contrib/ios -F "$fw" -framework Julia \
                -Wl,-rpath,"$fw" \
                contrib/ios/julia_ios_init.c \
                contrib/ios/simulator-runtests.c -o "$PWD/iostests"
          file "$PWD/iostests"

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x.get('isAvailable')))")
          echo "using simulator $udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # The payoff: iOS-targeted libjulia, an iOS-targeted sysimage, and every
      # ccall in the self-test going through libffi in the interpreter.
      - name: Run the self-test in the simulator
        run: |
          xcrun simctl spawn "$SIM_UDID" "$PWD/selftest" \
                "$PWD/build-ios-sim/install/Frameworks" \
                "$PWD/ios-out/julia-runtime-resources" \
                "$RUNNER_TEMP/depot"

      # Tier 1: upstream's own runner, against the staged tree, with the JIT
      # on.  One invocation per test name, because test/runtests.jl only
      # avoids `addprocs` — which would spawn a julia executable that does not
      # exist here — when the selection expands to exactly one test set.
      #
      # `env -u CI`: with CI set, runtests.jl writes Buildkite result JSON
      # next to the test tree, which is not what this step is measuring.
      #
      # The JIT is a simulator-only luxury (it runs under macOS rules), so a
      # pass here says the runtime, sysimage and staged stdlib tree are sound
      # — not that a device would get this far.  Tier 2 below is the
      # device-representative half.
      - name: "Tier 1: Julia's test suite under the JIT"
        env:
          TIER1_TESTS: >-
            goto some meta ordering osutils version int checked bitset
            operators intfuncs char copy functional namedtuple tuple sets
            dict hashing sorting cartesian specificity
        run: |
          failed=""
          for t in $TIER1_TESTS; do
            echo "::group::$t"
            if env -u CI xcrun simctl spawn "$SIM_UDID" "$PWD/iostests" \
                 "$PWD/build-ios-sim/install/Frameworks" \
                 "$PWD/ios-out/julia-runtime-resources" \
                 "$RUNNER_TEMP/depot-tests" runtests jit "$t"
            then echo "PASS $t"
            else echo "FAIL $t"; failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "tier 1 failures:$failed"
            exit 1
          fi

      # Tier 2: the same test files, run the way a device has to run them —
      # one process, no Distributed, no subprocesses, and --compile=min so
      # everything outside the sysimage goes through the interpreter (every
      # `ccall` included; see src/interpreter-ccall.c).  This is the shape
      # that matters for the port, and it is why the selection is small:
      # interpreted test sets cost orders of magnitude more than compiled ones.
      # Runs even when tier 1 failed.  The two exercise different execution
      # modes, a full cycle here costs hours, and a tier 1 failure is often
      # something tier 2 would not hit at all — so getting both signals from
      # one run is worth more than stopping at the first.
      - name: "Tier 2: Julia's test suite under the interpreter"
        if: ${{ !cancelled() }}
        env:
          TIER2_TESTS: "goto some ordering osutils version meta"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/tier2.log"
          env -u CI xcrun simctl spawn "$SIM_UDID" "$PWD/iostests" \
              "$PWD/build-ios-sim/install/Frameworks" \
              "$PWD/ios-out/julia-runtime-resources" \
              "$RUNNER_TEMP/depot-tests-interp" ios interp $TIER2_TESTS 2>&1 | tee "$log"
          # The driver reports 0 failures whether it ran every test set or none
          # of them, so a green step is not by itself evidence that anything
          # ran.  Require the summary to account for the whole selection.
          want=$(printf '%s\n' $TIER2_TESTS | grep -c .)
          grep -q "ios_runtests: $want/$want test set(s) passed" "$log" || {
            echo "::error::tier 2 exited 0 without reporting $want/$want passed"
            exit 1
          }

      # Narrows the one failure the two tiers disagree about.  Tier 2 dies
      # loading Test from source under --compile=min, on
      # `MethodError: no method matching sort!(::Vector{Symbol})` raised from
      # `Base.names` inside JuliaSyntaxHighlighting -- while tier 1 loads the
      # same chain under the JIT and passes, and the host reproduces neither.
      # This runs the same question directly in both modes: does the method
      # exist, does dispatch find it, does the call work in isolation.
      # Informational, so it never fails the job.
      #
      # Runs LAST, after both tiers, because that is the only place its output
      # can be read: the workflow-log API serves a bounded tail, and tier 1
      # emits several hundred lines, which would push anything before it out
      # of reach.
      - name: Probe the mode-dependent dispatch failure
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          for m in jit interp; do
            echo "::group::probe ($m)"
            env -u CI xcrun simctl spawn "$SIM_UDID" "$PWD/iostests" \
                "$PWD/build-ios-sim/install/Frameworks" \
                "$PWD/ios-out/julia-runtime-resources" \
                "$RUNNER_TEMP/depot-probe-$m" probe "$m" || true
            echo "::endgroup::"
          done

      # Leave the runner's simulator as we found it; `delete` would remove a
      # device from the image, so only shut down.
      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "${SIM_UDID:-booted}" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-output
          path: ios-out
          if-no-files-found: warn

  ios-build:
    name: iOS device cross-build
    needs: host-build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_ios_build) ||
      contains(github.event.head_commit.message, '[run-ios]')
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: deps/srccache
          key: srccache-v2-${{ hashFiles('deps/*.version', 'deps/checksums/**') }}
          restore-keys: srccache-v2-

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo "NPROC=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      # Before the dependency cache is restored, deliberately: `configure`
      # prompts on a non-empty BUILDROOT and there is no tty to answer it.
      # build-xcframework.sh skips its own configure once Make.inc exists.
      - name: Configure the out-of-tree build
        run: make O=build-ios-device configure

      - name: Cache the iOS dependency prefix
        id: iosdeps
        uses: actions/cache@v4
        with:
          path: build-ios-device/usr
          key: iosdeps-device-${{ hashFiles('deps/*.version', 'deps/*.mk', 'deps/patches/**', 'deps/checksums/**', 'Make.inc') }}

      - uses: actions/download-artifact@v4
        with:
          name: host-usr
          path: ${{ runner.temp }}
      - name: Restore the host julia
        run: |
          tar -xzf "$RUNNER_TEMP/host-usr.tar.gz"
          ./usr/bin/julia -e 'println("host julia restored: ", VERSION)'

      # See the simulator job for why symlinks are skipped and why the stdlib
      # install state cannot come out of the cache with the rest of usr/.
      - name: Mark the restored dependency prefix current
        if: steps.iosdeps.outputs.cache-hit == 'true'
        run: find build-ios-device/usr ! -type l -exec touch {} +

      - name: Re-install the stdlibs over the restored prefix
        if: steps.iosdeps.outputs.cache-hit == 'true'
        run: |
          v="v$(cut -d. -f1-2 < VERSION)"
          rm -rf "build-ios-device/usr/manifest/$v" \
                 "build-ios-device/usr/share/julia/stdlib/$v"

      - name: Build the device slice
        env:
          SLICES: iphoneos
        run: contrib/ios/build-xcframework.sh "$PWD/ios-out"

      # A wrong-architecture object is the failure mode --target exists to
      # prevent, and it stays silent until the app refuses to launch.
      - name: Sysimage is an iOS arm64 Mach-O
        run: |
          sys=build-ios-device/usr/lib/julia/sys.dylib
          file "$sys"
          lipo -archs "$sys" | grep -qx arm64 || { echo "not arm64"; exit 1; }
          vtool -show-build-version "$sys" | tee /tmp/vtool.txt
          # vtool spells it IOS, and IOSSIMULATOR for the other slice, so match
          # case-insensitively but require the word to end there -- a simulator
          # build must not satisfy the device job.
          grep -qiE 'platform[[:space:]]+ios[[:space:]]*$' /tmp/vtool.txt \
            || { echo "sys.dylib is not built for iOS"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-output
          path: ios-out
          if-no-files-found: warn
